[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokensmith"
description = "TokenSmith: Virtual Teaching Assistant based on Large Language Models"
authors = []
license = {text = "MIT"}
requires-python = ">=3.9,<3.13"
version = "0.1.0"
dependencies = [
    "docling>=2.69.1",
    "faiss-cpu>=1.13.0",
    "fastapi>=0.128.8",
    "google-genai>=1.47.0",
    "langchain-text-splitters>=0.0.8",
    "markdown>=3.9",
    "nltk>=3.9.2",
    "ollama>=0.6.2",
    "pydantic>=2.13.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.1.2",
    "uvicorn>=0.39.0",
]

[project.scripts]
tokensmith = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests for API compatibility (run with: pytest -m unit)",
]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=8.4.2",
    "ruff>=0.15.12",
]
